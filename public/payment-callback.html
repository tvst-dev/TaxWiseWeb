<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment - TaxWise</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
      line-height: 1;
    }

    .error-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
      line-height: 1;
    }

    h1 {
      color: #1f2937;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .details {
      background: #f9fafb;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      color: #374151;
    }

    .detail-value {
      color: #6b7280;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s;
      margin-top: 20px;
      cursor: pointer;
    }

    .btn:hover {
      background: #5568d3;
    }

    .error-details {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      color: #991b1b;
      font-size: 14px;
    }

    #status-text {
      font-size: 14px;
      color: #6b7280;
      margin-top: 10px;
      font-weight: 500;
    }

    .debug-info {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      font-size: 12px;
      color: #374151;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Processing Payment...</h1>
    <p id="message">Please wait while we verify your payment</p>
    <div id="status-text"></div>
    <div id="details" class="details" style="display:none;"></div>
    <div id="error-details" class="error-details" style="display:none;"></div>
    <div id="debug-info" class="debug-info" style="display:none;"></div>
    <a href="/dashboard" id="dashboard-btn" class="btn" style="display:none;">Go to Dashboard</a>
    <a href="/pricing" id="pricing-btn" class="btn" style="display:none;">Return to Pricing</a>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Initialize Supabase
    const supabaseUrl = 'https://awxyikflylmdqtpjzfdd.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3eHlpa2ZseWxtZHF0cGp6ZmRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1OTk5NzAsImV4cCI6MjA3NTE3NTk3MH0.Cf0cp0iBYwnYTj1d3TSsqJKY-fq0GMY2DCvv9bBbYN4';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Debug mode (set to false in production)
    const DEBUG = true;

    function logDebug(message, data = null) {
      console.log(message, data);
      if (DEBUG && data) {
        const debugDiv = document.getElementById('debug-info');
        debugDiv.style.display = 'block';
        debugDiv.innerHTML += `<div><strong>${message}</strong><br/><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
      }
    }

    // Helper functions
    function showSuccess(message, details = {}) {
      document.getElementById('spinner').style.display = 'none';
      
      // Create success icon container
      const successHtml = `
        <div class="success-icon">&#10003;</div>
        <h1 style="color: #10b981; margin-top: 10px;">Payment Successful!</h1>
      `;
      document.getElementById('title').innerHTML = successHtml;
      document.getElementById('message').textContent = message;
      
      if (Object.keys(details).length > 0) {
        const detailsDiv = document.getElementById('details');
        detailsDiv.style.display = 'block';
        detailsDiv.innerHTML = Object.entries(details).map(([key, value]) => `
          <div class="detail-row">
            <span class="detail-label">${key}:</span>
            <span class="detail-value">${value}</span>
          </div>
        `).join('');
      }
      
      document.getElementById('dashboard-btn').style.display = 'inline-block';
      
      // Auto redirect
      updateStatus('Redirecting to dashboard in 3 seconds...');
      setTimeout(() => {
        console.log('✅ Redirecting to dashboard...');
        window.location.href = '/dashboard';
      }, 3000);
    }

    function showError(message, errorDetails = null) {
      document.getElementById('spinner').style.display = 'none';
      
      // Create error icon container
      const errorHtml = `
        <div class="error-icon">&#10005;</div>
        <h1 style="color: #ef4444; margin-top: 10px;">Payment Failed</h1>
      `;
      document.getElementById('title').innerHTML = errorHtml;
      document.getElementById('message').textContent = message;
      
      if (errorDetails) {
        const errorDiv = document.getElementById('error-details');
        errorDiv.style.display = 'block';
        errorDiv.textContent = `Error: ${errorDetails}`;
      }
      
      document.getElementById('pricing-btn').style.display = 'inline-block';
    }

    function updateStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    async function verifyPayment() {
      try {
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference');
        const trxref = urlParams.get('trxref');

        logDebug('🔍 Payment Callback Started', { reference, trxref });

        if (!reference && !trxref) {
          showError('No payment reference found. Please try again.');
          return;
        }

        const paymentRef = reference || trxref;
        updateStatus('Verifying payment with Paystack...');

        // STEP 1: Get current user session
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        
        if (sessionError || !session) {
          logDebug('❌ Session error', sessionError);
          showError('Session expired. Please log in and try again.');
          setTimeout(() => window.location.href = '/auth', 2000);
          return;
        }

        logDebug('✅ User session found', { userId: session.user.id });
        updateStatus('Verifying payment...');

        // STEP 2: Call edge function to verify payment
        const { data: verifyData, error: verifyError } = await supabase.functions.invoke('verify-payment', {
          body: { reference: paymentRef },
          headers: {
            'Authorization': `Bearer ${session.access_token}`
          }
        });

        logDebug('📊 Verify response', verifyData);

        if (verifyError) {
          logDebug('❌ Verification error', verifyError);
          showError('Payment verification failed', verifyError.message);
          return;
        }

        if (!verifyData || !verifyData.status) {
          logDebug('❌ Verification failed', verifyData);
          showError(verifyData?.message || 'Payment verification failed. Please contact support.');
          return;
        }

        // STEP 3: Check payment status - try multiple paths
        let paymentStatus = null;
        
        // Try different paths where status might be
        if (verifyData.data?.status) {
          paymentStatus = verifyData.data.status;
        } else if (verifyData.status === true && verifyData.data) {
          // Paystack returns { status: true, data: { ... } } on success
          paymentStatus = 'success';
        } else if (verifyData.status) {
          paymentStatus = verifyData.status;
        }

        logDebug('💳 Payment status', { 
          extracted: paymentStatus, 
          rawData: verifyData.data,
          rawStatus: verifyData.status 
        });
        
        if (paymentStatus !== 'success') {
          logDebug('⚠️ Payment not successful', paymentStatus);
          showError(`Payment ${paymentStatus || 'failed'}. Please try again.`);
          return;
        }

        logDebug('✅ Payment verified as successful!');
        updateStatus('Activating your subscription...');

        // STEP 4: Extract metadata
        const metadata = verifyData.data?.metadata || verifyData.metadata || {};
        const customFields = verifyData.data?.custom_fields || verifyData.custom_fields || [];
        
        let plan = metadata.plan;
        if (!plan && customFields.length > 0) {
          const planField = customFields.find(f => f.variable_name === 'plan');
          plan = planField?.value;
        }
        
        logDebug('📋 Metadata extracted', { plan, metadata, customFields });

        if (!plan) {
          logDebug('⚠️ Plan not in metadata, checking profile...');
          
          const { data: profileData } = await supabase
            .from('profiles')
            .select('subscription_plan')
            .eq('user_id', session.user.id)
            .maybeSingle();
          
          if (profileData?.subscription_plan) {
            plan = profileData.subscription_plan;
            logDebug('✅ Using plan from profile', plan);
          } else {
            showError('Payment successful but plan information is missing. Please contact support with reference: ' + paymentRef);
            return;
          }
        }

        // STEP 5: Update profile
        const updateData = {
          subscription_status: 'active',
          subscription_plan: plan,
          onboarding_status: 'active',
          subscription_start: new Date().toISOString(),
          subscription_end: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
          payment_reference: paymentRef,
          updated_at: new Date().toISOString()
        };

        // Add company details if present
        if (metadata.company_name) updateData.company_name = metadata.company_name;
        if (metadata.company_size) updateData.company_size = metadata.company_size;
        if (metadata.job_title) updateData.job_title = metadata.job_title;
        if (metadata.is_company_rep !== undefined) updateData.is_company_rep = metadata.is_company_rep;

        logDebug('📝 Updating profile', updateData);

        const { error: updateError } = await supabase
          .from('profiles')
          .update(updateData)
          .eq('user_id', session.user.id);

        if (updateError) {
          logDebug('❌ Profile update error', updateError);
          showError('Payment successful but failed to activate subscription. Please contact support.', updateError.message);
          return;
        }

        logDebug('✅ Profile updated successfully!');

        // Calculate amount
        const amount = verifyData.data?.amount ? (verifyData.data.amount / 100) : 0;

        // Success!
        showSuccess('Your subscription has been activated!', {
          'Plan': plan.replace('_', ' ').toUpperCase(),
          'Amount': `₦${amount.toLocaleString()}`,
          'Reference': paymentRef
        });

      } catch (error) {
        logDebug('❌ Unexpected error', error);
        showError('An error occurred while processing your payment', error.message);
      }
    }

    // Start verification when page loads
    verifyPayment();
  </script>
</body>
</html>
