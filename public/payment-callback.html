<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment - TaxWise</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
    }

    .error-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
    }

    h1 {
      color: #1f2937;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .details {
      background: #f9fafb;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      color: #374151;
    }

    .detail-value {
      color: #6b7280;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s;
      margin-top: 20px;
    }

    .btn:hover {
      background: #5568d3;
    }

    .error-details {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      color: #991b1b;
      font-size: 14px;
    }

    #status-text {
      font-size: 14px;
      color: #6b7280;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Processing Payment...</h1>
    <p id="message">Please wait while we verify your payment</p>
    <div id="status-text"></div>
    <div id="details" class="details" style="display:none;"></div>
    <div id="error-details" class="error-details" style="display:none;"></div>
    <a href="/dashboard" id="dashboard-btn" class="btn" style="display:none;">Go to Dashboard</a>
    <a href="/pricing" id="pricing-btn" class="btn" style="display:none;">Return to Pricing</a>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Initialize Supabase
    const supabaseUrl = 'https://awxyikflylmdqtpjzfdd.supabase.co'; // Replace with your actual URL
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3eHlpa2ZseWxtZHF0cGp6ZmRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1OTk5NzAsImV4cCI6MjA3NTE3NTk3MH0.Cf0cp0iBYwnYTj1d3TSsqJKY-fq0GMY2DCvv9bBbYN4'; // Replace with your actual key
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Helper functions
    function showSuccess(message, details = {}) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').innerHTML = '<div class="success-icon">✓</div>Payment Successful!';
      document.getElementById('message').textContent = message;
      
      if (Object.keys(details).length > 0) {
        const detailsDiv = document.getElementById('details');
        detailsDiv.style.display = 'block';
        detailsDiv.innerHTML = Object.entries(details).map(([key, value]) => `
          <div class="detail-row">
            <span class="detail-label">${key}:</span>
            <span class="detail-value">${value}</span>
          </div>
        `).join('');
      }
      
      document.getElementById('dashboard-btn').style.display = 'inline-block';
      
      // Auto-redirect after 3 seconds
      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 3000);
    }

    function showError(message, errorDetails = null) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').innerHTML = '<div class="error-icon">✕</div>Payment Failed';
      document.getElementById('message').textContent = message;
      
      if (errorDetails) {
        const errorDiv = document.getElementById('error-details');
        errorDiv.style.display = 'block';
        errorDiv.textContent = `Error: ${errorDetails}`;
      }
      
      document.getElementById('pricing-btn').style.display = 'inline-block';
    }

    function updateStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    async function verifyPayment() {
      try {
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference');
        const trxref = urlParams.get('trxref');

        console.log('🔍 Payment Callback - Reference:', reference || trxref);

        if (!reference && !trxref) {
          showError('No payment reference found. Please try again.');
          return;
        }

        const paymentRef = reference || trxref;
        updateStatus('Verifying payment with Paystack...');

        // ✅ STEP 1: Get current user session
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        
        if (sessionError || !session) {
          console.error('❌ Session error:', sessionError);
          showError('Session expired. Please log in and try again.');
          setTimeout(() => window.location.href = '/auth', 2000);
          return;
        }

        console.log('✅ User session found:', session.user.id);
        updateStatus('Verifying payment...');

        // ✅ STEP 2: Call edge function to verify payment
        const { data: verifyData, error: verifyError } = await supabase.functions.invoke('verify-payment', {
          body: { reference: paymentRef },
          headers: {
            'Authorization': `Bearer ${session.access_token}`
          }
        });

        console.log('📊 Verify response:', verifyData);

        if (verifyError) {
          console.error('❌ Verification error:', verifyError);
          showError('Payment verification failed', verifyError.message);
          return;
        }

        if (!verifyData || !verifyData.status) {
          console.error('❌ Verification failed:', verifyData);
          showError(verifyData?.message || 'Payment verification failed. Please contact support.');
          return;
        }

        // ✅ STEP 3: Check if payment was successful
        if (verifyData.data.status !== 'success') {
          console.log('⚠️ Payment not successful:', verifyData.data.status);
          showError(`Payment ${verifyData.data.status}. Please try again.`);
          return;
        }

        console.log('✅ Payment successful!');
        updateStatus('Activating your subscription...');

        // ✅ STEP 4: Extract metadata from Paystack response
        const metadata = verifyData.data.metadata || {};
        const plan = metadata.plan || metadata.custom_fields?.find(f => f.variable_name === 'plan')?.value;
        
        console.log('📋 Payment metadata:', metadata);
        console.log('📋 Selected plan:', plan);

        if (!plan) {
          console.error('❌ Missing plan in payment response');
          showError('Payment successful but plan information is missing. Please contact support with reference: ' + paymentRef);
          return;
        }

        // ✅ STEP 5: Update profile with subscription details
        const updateData = {
          subscription_status: 'active',
          subscription_plan: plan,
          onboarding_status: 'active',
          subscription_start: new Date().toISOString(),
          subscription_end: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(), // 30 days
          payment_reference: paymentRef,
          updated_at: new Date().toISOString()
        };

        // ✅ Add company details if present in metadata
        if (metadata.company_name) {
          updateData.company_name = metadata.company_name;
        }
        if (metadata.company_size) {
          updateData.company_size = metadata.company_size;
        }
        if (metadata.job_title) {
          updateData.job_title = metadata.job_title;
        }
        if (metadata.is_company_rep !== undefined) {
          updateData.is_company_rep = metadata.is_company_rep;
        }

        console.log('📝 Updating profile with:', updateData);

        const { error: updateError } = await supabase
          .from('profiles')
          .update(updateData)
          .eq('user_id', session.user.id);

        if (updateError) {
          console.error('❌ Profile update error:', updateError);
          showError('Payment successful but failed to activate subscription. Please contact support.', updateError.message);
          return;
        }

        console.log('✅ Profile updated successfully!');

        // ✅ Success!
        showSuccess('Your subscription has been activated!', {
          'Plan': plan.replace('_', ' ').toUpperCase(),
          'Amount': `₦${(verifyData.data.amount / 100).toLocaleString()}`,
          'Reference': paymentRef
        });

      } catch (error) {
        console.error('❌ Payment verification error:', error);
        showError('An error occurred while processing your payment', error.message);
      }
    }

    // Start verification when page loads
    verifyPayment();
  </script>
</body>
</html>
